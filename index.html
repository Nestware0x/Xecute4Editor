<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:; base-uri 'none'; form-action 'none'; connect-src 'none'">
  <title>Xecute Editor 4</title>
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div class="logo">X</div>
      <div>
        <h1>Xecute Editor 4</h1>
        <div class="subtitle">STATIC CONFIGURATION</div>
      </div>
      <div class="brand-status">
        <span class="brand-status-text">サーバーと通信しない静的エディター</span>
        <span class="safe-badge">ローカル処理</span>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="ダークモードに切り替える" aria-pressed="false">
          <span class="theme-icon theme-icon-light" aria-hidden="true">☀</span>
          <span class="theme-icon theme-icon-dark" aria-hidden="true">☾</span>
          <span id="themeLabel">ライト</span>
        </button>
      </div>
    </header>

    <div id="message" class="notice hidden" role="status" aria-live="polite"></div>
    <section id="editor" class="workspace hidden">
      <aside class="sidebar">
        <div class="sidebar-kicker"><span aria-hidden="true">←</span><span>サーバー設定</span></div>
        <div class="server-summary">
          <div id="serverInitial" class="server-icon">D</div>
          <div class="server-text">
            <div id="sidebarGuildName" class="server-name">Discord Server</div>
            <div class="server-label">Xecute settings</div>
          </div>
        </div>
        <nav id="navigation" class="navigation" aria-label="設定一覧"></nav>
      </aside>

      <div class="content">
        <header id="pageTop" class="hero">
          <div class="eyebrow">Server configuration</div>
          <h2 id="guildName">Discord Server</h2>
          <div class="hero-copy">Xross Engineと各プラグインが公開している設定を、このページからまとめて編集できます。</div>
          <div id="expiry" class="expiry-badge"></div>
        </header>
        <div id="settings" class="settings"></div>
      </div>
    </section>
  </main>

  <div id="actions" class="actions hidden">
    <div class="muted action-note">設定はこのブラウザー内だけで処理されます。</div>
    <div class="button-row">
      <button id="resetButton" type="button">元に戻す</button>
      <button id="copyButton" class="primary" type="button">適用コードをコピー</button>
    </div>
  </div>
</body>
</html>
